[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
# `src/` is READ-ONLY, and the test that needs it is the §D.6 review assertion: the shipping
# source must contain no oracle, collateral or liquidation machinery, checked by reading it.
# `frontend/` is read for the same reason `src/` is: `test/queue/Frontend.t.sol` reads the page's
# hardcoded call selectors and asserts each against the compiler's own, so a renamed view cannot
# leave the viewer silently rendering zeros.
fs_permissions = [
    {access = "read-write", path = ".forge-snapshots/"},
    {access = "read", path = "src/"},
    {access = "read", path = "frontend/"},
    # test_7_8 reads both source files to pin the campaign's phi against the deploy
    # script's PREMIUM_BPS. They had already drifted (8,500 vs 7,900) behind a comment
    # that named its source and was wrong about it -- PITFALLS 5.86: prose is not an interlock.
    {access = "read", path = "script/"},
    {access = "read", path = "test/"},
]
libs = ["lib"]
out = "out"
solc_version = "0.8.30"
src = "src"
via_ir = false

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

# PHASE 6 — the adversarial and invariant campaign (PLAN §D.8).
#
# `fail_on_revert = false` is the DELIBERATE choice and §D.8 V5 requires the reason to be written
# down. The handler is expected to hit legitimate reverts — authorisation on a seat you do not own,
# over-withdrawal, `QueueUnderflow` when the queue cannot source a swap, buying your own seat.
# `true` would abort every sequence at the first of them, so nothing deep would ever be reached.
#
# What normally makes `false` dangerous is that it hides a handler whose calls ALL revert. That is
# closed here by two things that are stronger than the flag: the handler classifies every revert
# against an explicit allow-list and I7 asserts the unexpected count is zero, and
# `test_6_0_campaignWasNotVacuous` asserts the campaign actually landed calls on each path.
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

# TEMPORARY research profile (protocol-fee experiment, PLAN §E.5). Does not touch the default
# profile. Points src/test at the archived tree so the archived spike can run unmodified.
[profile.spike]
src = "archive/2026-08-26/src"
test = "archive/2026-08-26/test"
